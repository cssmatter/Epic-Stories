name: Upload Ghazal Reels Shayari

on:
  schedule:
    # Run every day at 06:00 UTC
    - cron: '0 6 * * *'

  workflow_dispatch:

permissions:
  contents: write  # Required to commit changes back to the repository

jobs:
  upload-ghazals:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg fonts-liberation fonts-liberation2 fonts-indic fonts-noto-core libfontconfig1 libfreetype6 libgl1 libegl1 libopengl0
        
    - name: Set up Node.js for yt-dlp JS execution
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        # Use requirements.txt which has been optimized for CI
        pip install -r requirements.txt
        # Force update yt-dlp to latest to bypass bot detection
        pip install -U yt-dlp
    
    - name: Restore YouTube credentials
      env:
        CLIENT_SECRETS: ${{ secrets.CLIENT_SECRETS_JSON }}
        SHAYARI_TOKEN_PICKLE: ${{ secrets.SHAYARI_TOKEN_PICKLE_BASE64 }}
        YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
      run: |
        echo "$CLIENT_SECRETS" > client_secrets.json
        echo "$SHAYARI_TOKEN_PICKLE" | base64 -d > token_shayari.pickle
        if [ -n "$YOUTUBE_COOKIES" ]; then
          echo "$YOUTUBE_COOKIES" > cookies.txt
          if head -n 1 cookies.txt | grep -q "# Netscape"; then
            echo "Cookies restored and verified (Netscape format)."
          else
            echo "::warning::Cookies restored but do not follow Netscape format. Processing might fail."
          fi
        else
          echo "Warning: YOUTUBE_COOKIES secret is empty."
        fi
    
    - name: Check if ghazal songs are available
      id: check_ghazals
      run: |
        song_count=$(python -c "import json; print(len(json.load(open('data/shayari/ghazal_songs.json', encoding='utf-8'))))")
        echo "song_count=$song_count" >> $GITHUB_OUTPUT
        if [ "$song_count" -eq 0 ]; then
          echo "No ghazal songs remaining."
          echo "songs_available=false" >> $GITHUB_OUTPUT
        else
          echo "Songs available: $song_count"
          echo "songs_available=true" >> $GITHUB_OUTPUT
        fi
    
    - name: Process Uploads and Scheduling
      env:
        IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN_SHAYARI }}
        IG_BUSINESS_ID: ${{ secrets.IG_BUSINESS_ID_SHAYARI }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        PYTHONPATH: ${{ github.workspace }}
        PY_UPLOAD_SCRIPT: |
          import sys, json, youtube_uploader
          from datetime import datetime, timedelta, timezone

          if len(sys.argv) < 2:
              print("No metadata file provided.")
              sys.exit(0)
              
          meta_file = sys.argv[1]
          print(f"\n[QUEUE] Processing the next reel: {meta_file}")
          
          with open(meta_file, 'r', encoding='utf-8') as f:
              meta = json.load(f)
              
          # Normalize Windows backslashes to Linux forward slashes
          clean_video_path = meta['video_path'].replace('\\', '/')
          
          raw_keywords = meta.get('keywords', ['ghazal', 'shayari'])
          str_keywords = ",".join(raw_keywords) if isinstance(raw_keywords, list) else raw_keywords
          
          print("Publishing to YouTube IMMEDIATELY")
          vid_id = youtube_uploader.upload_video(
              clean_video_path, meta['title'], meta['description'], category_id='22', 
              keywords=str_keywords, token_file='token_shayari.pickle',
              publish_at=None # Daily drip: Action runs daily, so all posts are immediate
          )
          print(f'YouTube Video ID: {vid_id}')
      run: |
        # Collect all metadata files (Daily Drip: We sort and pick ONLY the first one)
        shopt -s nullglob
        
        # Use readarray to safely handle filenames with spaces
        readarray -t sorted_files < <(ls -v downloads/*/upload_metadata_*.json 2>/dev/null)
        
        if [ ${#sorted_files[@]} -eq 0 ]; then
           echo "Queue is empty. No pre-generated reels found in downloads/."
           exit 0
        fi
        
        first_meta="${sorted_files[0]}"
        echo "Daily Queue: Picking \"$first_meta\""
        
        # Resolve the video path early for both (Using quoting to handle spaces)
        vid_path=$(python -c "import json, sys; print(json.load(open(sys.argv[1], encoding='utf-8'))['video_path'].replace(chr(92), '/'))" "$first_meta")
        
        # 1. INSTAGRAM UPLOAD FIRST (Most fragile part)
        echo "Uploading to Instagram..."
        chmod +x scripts/temp_upload.sh
        VIDEO_URL=$(./scripts/temp_upload.sh "$vid_path")
        
        if [[ $VIDEO_URL == http* ]]; then
          echo "Public Video URL: $VIDEO_URL"
          # Run instagram uploader. If it fails, the whole step fails.
          python instagram_graph_uploader.py "$VIDEO_URL" --metadata "$first_meta" || exit 1
        else
          echo "::error::Failed to generate public video URL for Instagram. Response: $VIDEO_URL"
          exit 1 # Stop here! YouTube won't happen and files won't be deleted.
        fi
        
        # 2. YOUTUBE UPLOAD (Only if Instagram succeeded)
        echo "$PY_UPLOAD_SCRIPT" > run_upload.py
        python run_upload.py "$first_meta" || exit 1
        
        # 3. SUCCESS CLEANUP (Only if both platforms worked)
        if [ -f /tmp/github_release_tag.txt ]; then
          RELEASE_TAG=$(cat /tmp/github_release_tag.txt)
          chmod +x scripts/cleanup_release.sh
          ./scripts/cleanup_release.sh "$RELEASE_TAG" "$GITHUB_TOKEN"
          rm -f /tmp/github_release_tag.txt
        fi
        
        # Delete the processed files (Use quoting for spaces)
        rm -f "$first_meta" "$vid_path"
        echo "Finished processing \"$first_meta\". Files removed from queue."

    - name: Commit cleanup (Remove uploaded videos from Queue)
      run: |
        git config --local user.email "11308641+cssmatter@users.noreply.github.com"
        git config --local user.name "cssmatter"
        
        # Add any deleted files in downloads/ to the commit
        git add -u downloads/
        
        if git diff --staged --quiet; then
          echo "No files were deleted/processed."
        else
          git commit -m "chore: remove published generated reels [skip ci]"
          git push
        fi

    - name: Clean up credentials
      if: always()
      run: |
        rm -f client_secrets.json token_shayari.pickle
