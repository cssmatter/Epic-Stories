name: Bible Study Pilot - YouTube and Instagram
on:
  workflow_dispatch:
    inputs:
      youtube_videos:
        description: YouTube videos to upload
        type: choice
        options: [both, short, long, none]
        default: both
      youtube_privacy:
        description: YouTube visibility
        type: choice
        options: [unlisted, public, private]
        default: unlisted
      instagram:
        description: Publish the Short to Instagram Reels (visible on your account)
        type: boolean
        default: true
permissions:
  contents: write
concurrency:
  group: bible-seniors-week01-pilot
  cancel-in-progress: false
jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install upload dependencies
        run: pip install requests google-auth-oauthlib google-auth-httplib2 google-api-python-client
      - name: Download finished pilot videos
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download bible-seniors-week01-pilot --dir pilot-media --pattern '*.mp4'
          sha256sum -c data/bible-pilot/sha256sums.txt
      - name: Restore existing channel credentials
        env:
          CLIENT_SECRETS: ${{ secrets.CLIENT_SECRETS_JSON }}
          CHANNEL_TOKEN: ${{ secrets.GODISGREATEST_TOKEN_PICKLE_BASE64 }}
        run: |
          python - <<'PY'
          import os, base64, pathlib
          pathlib.Path('client_secrets.json').write_text(os.environ['CLIENT_SECRETS'])
          pathlib.Path('token_godisgreatest.pickle').write_bytes(base64.b64decode(os.environ['CHANNEL_TOKEN']))
          PY
      - name: Upload selected videos and add download comments
        env:
          YOUTUBE_VIDEOS: ${{ inputs.youtube_videos }}
          YOUTUBE_PRIVACY: ${{ inputs.youtube_privacy }}
          UPLOAD_INSTAGRAM: ${{ inputs.instagram }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN_GODISGREATEST }}
          IG_BUSINESS_ID: ${{ secrets.IG_BUSINESS_ID_GODISGREATEST }}
        run: python scripts/bible_pilot/upload.py
      - name: Preserve completed uploads to prevent duplicates
        if: always()
        run: |
          if [ -f data/bible-pilot/upload-state.json ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/bible-pilot/upload-state.json
            if ! git diff --cached --quiet; then
              git commit -m 'Record Bible pilot upload results [skip ci]'
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          fi
      - name: Save upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bible-pilot-results
          path: data/bible-pilot/upload-state.json
          if-no-files-found: ignore
      - name: Remove restored credentials
        if: always()
        run: rm -f client_secrets.json token_godisgreatest.pickle
